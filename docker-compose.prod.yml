services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: Tranzor-backend:prod
    restart: always
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_SHUTDOWN_TIMEOUT_MS: 10000
    ports:
      - "3001:3001"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - backend_logs:/app/logs

  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_DATABASE: Tranzor
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tranzor}
      POSTGRES_USER: ${POSTGRES_USER:-tranzor_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TranzorAppPass2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tranzor_app} -d ${POSTGRES_DB:-tranzor}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: always
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  backend_data:
  backend_logs:
  mongo_data:
  postgres_data:
  redis_data:
  clickhouse_data:
