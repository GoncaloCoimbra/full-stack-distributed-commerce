services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-Tranzor}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - redis_data:/data

  postgres_Tranzor:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tranzor}
      POSTGRES_USER: ${POSTGRES_USER:-tranzor_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-TranzorAppPass2026}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tranzor_app} -d ${POSTGRES_DB:-tranzor}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_Tranzor_data:/var/lib/postgresql/data

  postgres_logistica:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_LOGISTICA_DB:-logistica}
      POSTGRES_USER: ${POSTGRES_LOGISTICA_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_LOGISTICA_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_LOGISTICA_USER:-postgres} -d ${POSTGRES_LOGISTICA_DB:-logistica}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_logistica_data:/var/lib/postgresql/data

  postgres_chatops:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_CHATOPS_DB:-chatops_db}
      POSTGRES_USER: ${POSTGRES_CHATOPS_USER:-chatops}
      POSTGRES_PASSWORD: ${POSTGRES_CHATOPS_PASSWORD:-chatops}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CHATOPS_USER:-chatops} -d ${POSTGRES_CHATOPS_DB:-chatops_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_chatops_data:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-Tranzor}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3001}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/Tranzor}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-tranzor_app}:${POSTGRES_PASSWORD:-TranzorAppPass2026}@postgres_Tranzor:5432/${POSTGRES_DB:-tranzor}}
      DATABASE_URL_READ_REPLICA: ${DATABASE_URL_READ_REPLICA:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLICKHOUSE_HTTP_URL: ${CLICKHOUSE_HTTP_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-secure-random-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace-with-a-secure-random-refresh-secret}
      APP_SHUTDOWN_TIMEOUT_MS: ${APP_SHUTDOWN_TIMEOUT_MS:-10000}
    ports:
      - "3001:3001"
    depends_on:
      postgres_Tranzor:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  postgres_Tranzor_data:
  postgres_logistica_data:
  postgres_chatops_data:
  clickhouse_data:
